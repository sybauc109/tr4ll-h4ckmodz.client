<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>tr4llhack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* System Toast HUD */
    #toast-container {
      position: fixed;
      top: 15px;
      right: -420px;
      z-index: 99999;
      transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    #toast-container.show {
      right: 15px;
    }

    .toast {
      min-width: 280px;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .toast-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .toast.success {
      background: rgba(0, 255, 136, 0.08);
      border-left: 4px solid #00ff88;
      border-top: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }

    .toast.success .toast-symbol {
      background: rgba(0, 255, 136, 0.2);
      border: 1px solid #00ff88;
      color: #00ff88;
    }

    .toast.error {
      background: rgba(255, 0, 85, 0.08);
      border-left: 4px solid #ff0055;
      border-top: 1px solid rgba(255, 0, 85, 0.3);
      color: #ff0055;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
    }

    .toast.error .toast-symbol {
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid #ff0055;
      color: #ff0055;
    }

    /* Layout Tổng */
    .app-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Banner Ảnh Tròn ở Giữa */
    .banner-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 20px auto;
      box-shadow: 0 0 25px rgba(0, 170, 255, 0.4);
      border: 2px solid rgba(0, 170, 255, 0.6);
    }

    /* UI Login */
    #login-menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .device-info {
      color: #8a8d9b;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
      text-align: center;
    }

    .device-info span {
      color: #00aaff;
      font-weight: 600;
    }

    .input-group {
      width: 100%;
      margin-bottom: 14px;
    }

    .key-input {
      width: 100%;
      padding: 14px;
      background: rgba(0, 170, 255, 0.05);
      border: 1px solid rgba(0, 170, 255, 0.3);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      text-align: center;
      outline: none;
      box-shadow: inset 0 0 10px rgba(0, 170, 255, 0.1);
      transition: all 0.3s;
    }

    .key-input:focus {
      border-color: #00aaff;
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, rgba(0, 170, 255, 0.8), rgba(0, 90, 255, 0.9));
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
    }

    .contact-info {
      margin-top: 20px;
      color: #555560;
      font-size: 12px;
    }

    .contact-info a {
      color: #00aaff;
      text-decoration: none;
    }

    /* UI Dashboard */
    #dashboard-menu {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .support-tag {
      color: #00aaff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 170, 255, 0.4);
    }

    .btn-add-happ {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 170, 255, 0.2));
      border: 1px solid rgba(0, 255, 136, 0.5);
      border-radius: 12px;
      color: #00ff88;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
      transition: all 0.3s;
    }

    .btn-add-happ:active {
      transform: scale(0.98);
    }

    .tab-content {
      display: none;
      width: 100%;
      margin-bottom: 15px;
    }

    .tab-content.active {
      display: block;
    }

    /* Info Tab Gọn */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .info-item {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 13px;
      color: #8a8d9b;
    }

    .info-item span {
      color: #ffffff;
      font-weight: 600;
      float: right;
    }

    /* Function Tab Gọn */
    .function-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .function-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-size: 13px;
    }

    .function-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .func-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 22px;
      background: rgba(0, 170, 255, 0.1);
      border: 1px solid rgba(0, 170, 255, 0.3);
      color: #00aaff;
      font-family: monospace;
      font-size: 10px;
      font-weight: bold;
      border-radius: 4px;
    }

    /* Switch iOS */
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s;
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #00aaff;
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.6);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Tab Bar Dưới Cùng */
    .tab-bar {
      display: flex;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      color: #555560;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .tab-draw-icon {
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
    }

    .tab-item.active {
      color: #ffffff;
      background: rgba(0, 170, 255, 0.2);
      border: 1px solid rgba(0, 170, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- Toast Thông Báo HUD -->
  <div id="toast-container">
    <div id="toast" class="toast">
      <span id="toast-symbol" class="toast-symbol">!</span>
      <span id="toast-message">SYSTEM READY</span>
    </div>
  </div>

  <div class="app-wrapper">
    
    <!-- MENU 1: LOGIN -->
    <div id="login-menu">
      <img class="banner-img" src="https://cdn.upanhlaylink.com/i/MIUzUABq.jpeg" alt="Banner Image">

      <div class="device-info">
        <div>iOS = <span class="ios-version">Đang kiểm tra...</span></div>
        <div>iPhone = <span class="iphone-model">Đang kiểm tra...</span></div>
      </div>

      <div class="input-group">
        <input type="text" class="key-input" placeholder="TRLL-XXXX-XXXX-XXXX-XXXX" id="keyInput" autocomplete="off">
      </div>

      <button class="btn-submit" onclick="verifyKey()">XÁC NHẬN KEY</button>

      <div class="contact-info">
        no key? contact Zalo <a href="https://zalo.me/0939251990" target="_blank">0939251990</a>
      </div>
    </div>

    <!-- MENU 2: DASHBOARD -->
    <div id="dashboard-menu">
      <img class="banner-img" src="https://cdn.upanhlaylink.com/i/EYaAZMcx.jpeg" alt="Dashboard Image">

      <!-- Content 1: Enable -->
      <div class="tab-content active" id="tab-enable">
        <div class="support-tag" style="text-align: center;">Support iOS 16 - 26.0.1</div>
        <button class="btn-add-happ" onclick="autoImportToHapp()">ADD HAPP (AUTO PROXY)</button>
      </div>

      <!-- Content 2: Info -->
      <div class="tab-content" id="tab-info">
        <div class="info-list">
          <div class="info-item">iOS <span class="ios-version">...</span></div>
          <div class="info-item">iPhone <span class="iphone-model">...</span></div>
          <div class="info-item">Key <span id="display-key">...</span></div>
          <div class="info-item">Admin <span>Nezis DS</span></div>
          <div class="info-item">Bundle Identifier id <span>vng.dsnezis.ffth</span></div>
        </div>
      </div>

      <!-- Content 3: Function -->
      <div class="tab-content" id="tab-function">
        <div class="function-list">
          <div class="function-item">
            <div class="function-name"><span class="func-tag">ESP</span><span>ESP Line</span></div>
            <label class="switch"><input type="checkbox" onchange="toggleFeature('ESP Line', this.checked)"><span class="slider"></span></label>
          </div>
          <div class="function-item">
            <div class="function-name"><span class="func-tag">BOX</span><span>ESP Box</span></div>
            <label class="switch"><input type="checkbox" onchange="toggleFeature('ESP Box', this.checked)"><span class="slider"></span></label>
          </div>
          <div class="function-item">
            <div class="function-name"><span class="func-tag">AIM</span><span>Aimbot</span></div>
            <label class="switch"><input type="checkbox" onchange="toggleFeature('Aimbot', this.checked)"><span class="slider"></span></label>
          </div>
          <div class="function-item">
            <div class="function-name"><span class="func-tag">SLN</span><span>Aim Silent</span></div>
            <label class="switch"><input type="checkbox" onchange="toggleFeature('Aim Silent', this.checked)"><span class="slider"></span></label>
          </div>
          <div class="function-item">
            <div class="function-name"><span class="func-tag">FLY</span><span>Bay dù 0.5s</span></div>
            <label class="switch"><input type="checkbox" onchange="toggleFeature('Bay dù 0.5s', this.checked)"><span class="slider"></span></label>
          </div>
        </div>
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('tab-enable', this)">
          <span class="tab-draw-icon">[v]</span>
          <span>Enable</span>
        </div>

        <div class="tab-item" onclick="switchTab('tab-info', this)">
          <span class="tab-draw-icon">(i)</span>
          <span>Info</span>
        </div>

        <div class="tab-item" onclick="switchTab('tab-function', this)">
          <span class="tab-draw-icon">[=]</span>
          <span>Function</span>
        </div>
      </div>

    </div>

  </div>

  <script>
    const VALID_KEY = "TRLL-9A8B-7C6D-5E4F-3210";

    function showToast(message, type = 'info', symbol = '!') {
      const container = document.getElementById('toast-container');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastSym = document.getElementById('toast-symbol');

      toastMsg.innerText = message;
      toastSym.innerText = symbol;
      toast.className = 'toast ' + type;
      container.classList.add('show');

      setTimeout(() => {
        container.classList.remove('show');
      }, 2500);
    }

    function toggleFeature(name, isChecked) {
      if (isChecked) {
        showToast("ĐÃ BẬT: " + name, "success", "✓");
      } else {
        showToast("ĐÃ TẮT: " + name, "error", "X");
      }
    }

    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    // TỰ ĐỘNG SAO CHÉP VÀ MỞ APP HAPP
    function autoImportToHapp() {
      // Chuỗi Proxy Hysteria đầy đủ cấu hình từ ảnh
      const hysteriaConfig = "hysteria://server.zenithsolitude.store:5560?protocol=udp&auth=tr4llmod&peer=server.zenithsolitude.store&insecure=1&obfs=freefireth.com.ds#NEZIS%20DS%20MODZ";

      // 1. Sao chép trực tiếp vào bộ nhớ tạm
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(hysteriaConfig);
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = hysteriaConfig;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
      }

      showToast("ĐÃ CHÉP PROXY & MỞ HAPP", "success", "✓");

      // 2. Kích hoạt mở App Happ
      setTimeout(() => {
        window.location.href = "happ://";
      }, 400);
    }

    function getExactIOSVersion() {
      const ua = navigator.userAgent;
      const match = ua.match(/(?:iPhone|CPU)\s+OS\s+(\d+[_.\d]*)/i);
      if (match && match[1]) return match[1].replace(/_/g, '.');

      const safariVerMatch = ua.match(/Version\/(\d+[\.\d]*)/i);
      if (safariVerMatch && (/iPhone|iPod|iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))) {
        return safariVerMatch[1];
      }
      return "18.3";
    }

    function getGLRenderer() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        }
      } catch (e) {}
      return '';
    }

    function triggerCrash() {
      window.location.href = "about:blank";
    }

    function detectExactDevice() {
      const ua = navigator.userAgent;
      const isIOS = /iPhone|iPod|iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      const iosVerStr = getExactIOSVersion();
      const iosVerNum = parseFloat(iosVerStr);

      if (iosVerNum < 16.0 || iosVerNum > 26.01) {
        triggerCrash();
        return;
      }

      document.querySelectorAll('.ios-version').forEach(el => el.innerText = iosVerStr);

      let iphoneModel = "iPhone";
      if (isIOS) {
        const w = window.screen.width;
        const h = window.screen.height;
        const ratio = window.devicePixelRatio;
        const gpu = getGLRenderer();

        if (w === 430 && h === 932) {
          if (gpu.includes('A17') || gpu.includes('G18')) iphoneModel = "iPhone 15 Pro Max";
          else if (gpu.includes('A18')) iphoneModel = "iPhone 16 Plus";
          else iphoneModel = "iPhone 14 Pro Max";
        } else if (w === 393 && h === 852) {
          if (gpu.includes('A17')) iphoneModel = "iPhone 15 Pro";
          else if (gpu.includes('A18')) iphoneModel = "iPhone 16";
          else if (gpu.includes('A16')) iphoneModel = "iPhone 15";
          else iphoneModel = "iPhone 14 Pro";
        } else if (w === 428 && h === 926) {
          iphoneModel = (ratio === 3) ? "iPhone 13 Pro Max" : "iPhone 12 Pro Max";
        } else if (w === 390 && h === 844) {
          if (gpu.includes('A15')) iphoneModel = "iPhone 14";
          else if (gpu.includes('Apple GPU')) iphoneModel = "iPhone 13";
          else iphoneModel = "iPhone 12";
        } else if (w === 414 && h === 896) {
          iphoneModel = (ratio === 3) ? "iPhone 11 Pro Max" : "iPhone 11";
        } else if (w === 375 && h === 812) {
          iphoneModel = (gpu.includes('A15')) ? "iPhone 13 mini" : "iPhone 11 Pro";
        } else if (w === 375 && h === 667) {
          iphoneModel = "iPhone SE";
        } else {
          iphoneModel = "iPhone";
        }
      } else {
        iphoneModel = "Thiết bị không phải iPhone";
      }

      document.querySelectorAll('.iphone-model').forEach(el => el.innerText = iphoneModel);
    }

    function verifyKey() {
      const input = document.getElementById('keyInput').value.trim();
      if (!input) {
        showToast("VUI LÒNG NHẬP KEY!", "error", "!");
        return;
      }

      if (input === VALID_KEY) {
        showToast("XÁC NHẬN KEY THÀNH CÔNG", "success", "✓");
        document.getElementById('display-key').innerText = input;

        setTimeout(() => {
          document.getElementById('login-menu').style.display = 'none';
          document.getElementById('dashboard-menu').style.display = 'flex';
        }, 500);
      } else {
        showToast("KEY KHÔNG ĐÚNG..", "error", "X");
      }
    }

    window.onload = detectExactDevice;
  </script>
</body>
</html>
